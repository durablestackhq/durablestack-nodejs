name: publish-npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show publish context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Ref name: $GITHUB_REF_NAME"
          echo "Workflow: $GITHUB_WORKFLOW"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $TAG_NAME does not match package.json version $PKG_VERSION (expected $EXPECTED_TAG)."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm (Trusted Publishing)
        id: publish_oidc
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: npm publish --provenance --access public

      - name: Check npm token availability
        id: has_token
        if: startsWith(github.ref, 'refs/tags/v') && steps.publish_oidc.outcome != 'success'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (token fallback)
        id: publish_token
        if: startsWith(github.ref, 'refs/tags/v') && steps.publish_oidc.outcome != 'success' && steps.has_token.outputs.available == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Fail if publish did not succeed
        if: startsWith(github.ref, 'refs/tags/v') && steps.publish_oidc.outcome != 'success' && (steps.has_token.outputs.available != 'true' || steps.publish_token.outcome != 'success')
        run: |
          echo "Publish failed with both Trusted Publishing and token fallback."
          echo "If Trusted Publishing is configured, verify npm Trusted Publisher settings and wait for propagation."
          echo "Otherwise, add repository secret NPM_TOKEN with an npm Automation token that has publish access to 'durablestack'."
          exit 1
